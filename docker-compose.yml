services:
  wildtoken:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:/data/wildtoken.db?mode=rwc
      APP__SERVER__HOST: 0.0.0.0
      APP__SERVER__PORT: "3100"
      APP__UPSTREAM__DEFAULT_TIMEOUT_SECONDS: "300"
      WILDTOKEN_LOG: info
      WILDTOKEN_THEME_DIR: /app/themes
    ports:
      - "3100:3100"
    # 让容器内可以用 host.docker.internal 访问宿主机发布的端口，
    # 包括其他容器 -p 出来的服务（例如 http://host.docker.internal:3001）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wildtoken-data:/data
      # 镜像已自带 themes/；此挂载会覆盖它，便于本地改主题免重建镜像。
      - ./themes:/app/themes:ro
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3100/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  wildtoken-data:
