[server]
host = "127.0.0.1"
port = 3100

[database]
url = "sqlite:wildtoken.db?mode=rwc"
max_connections = 3
sqlite_cache_size_kib = 2048
sqlite_statement_cache_capacity = 32
sqlite_mmap_size_bytes = 0
idle_timeout_seconds = 60
# Seals channel API keys and token copies at rest. Prefer ENCRYPTION_KEY in the
# environment; blank uses wildtoken.key beside the database, made on first start.
# encryption_key = ""

[logging]
log_queue_capacity = 512

[upstream]
default_timeout_seconds = 300.0

[admin]
token = "change-me"
# Header carrying the real client address when running behind a reverse proxy.
# Leave unset unless the proxy overwrites it — the header is caller-controlled,
# and trusting one no proxy rewrites lets callers shed their failure history.
# client_ip_header = "x-forwarded-for"

[themes]
dir = "themes"

# Generated images extracted from logged responses. Size cap is a runtime
# setting (console → 设置).
[images]
dir = "images"

# Daily database backup, without log bodies. Blank dir turns it off.
[backup]
dir = "backups"
at = "05:00"
keep = 10
