name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          commit="$(git rev-list -n 1 "$tag")"
          git checkout --detach "$commit"

          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/handlers/admin.go)"
          if [[ -z "$version" ]]; then
            echo "Could not read the service version from internal/handlers/admin.go" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match the service version v$version" >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Run tests
        run: go test -race ./...

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, test]
    # Every target is pure Go, so one Linux runner cross-compiles them all.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            goos: linux
            goarch: amd64
            binary: wildtoken
            archive: tar.gz
          - label: linux-aarch64
            goos: linux
            goarch: arm64
            binary: wildtoken
            archive: tar.gz
          - label: windows-x86_64
            goos: windows
            goarch: amd64
            binary: wildtoken.exe
            # The tray is the default on Windows, so the binary must not open a
            # console window.
            ldflags: -H=windowsgui
            archive: zip
          - label: macos-x86_64
            goos: darwin
            goarch: amd64
            binary: wildtoken
            archive: tar.gz
          - label: macos-aarch64
            goos: darwin
            goarch: arm64
            binary: wildtoken
            archive: tar.gz
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTRA_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w $EXTRA_LDFLAGS" \
            -o "build/${{ matrix.binary }}" ./cmd/wildtoken

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          package="wildtoken-${RELEASE_TAG}-${{ matrix.label }}"
          mkdir -p "$package"
          install -m 755 "build/${{ matrix.binary }}" "$package/${{ matrix.binary }}"
          cp -R static config themes "$package/"
          cp .env.example "$package/"
          test ! -e "$package/README.md"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r -q "${package}.zip" "$package"
            unzip -t "${package}.zip" >/dev/null
          else
            tar -czf "${package}.tar.gz" "$package"
            tar -tzf "${package}.tar.gz" >/dev/null
          fi

      - name: Smoke test the native build
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd "wildtoken-${RELEASE_TAG}-${{ matrix.label }}"
          APP__SERVER__PORT=3110 ADMIN_TOKEN=ci-admin-token-for-smoke-test \
            ./wildtoken >"$RUNNER_TEMP/wildtoken-linux.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS 'http://127.0.0.1:3110/health' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:3110/health' >/dev/null
          curl -fsS 'http://127.0.0.1:3110/admin' -o "$RUNNER_TEMP/wildtoken-admin.html"
          grep -q 'WildToken Admin' "$RUNNER_TEMP/wildtoken-admin.html"
          curl -fsS 'http://127.0.0.1:3110/theme-packs/bleach/theme.css' >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
          rm -f wildtoken.db wildtoken.db-shm wildtoken.db-wal

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: |
            wildtoken-*-${{ matrix.label }}.tar.gz
            wildtoken-*-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' | sort)
          if [[ "${#archives[@]}" -ne 5 ]]; then
            printf 'Expected 5 release archives, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
