name: Build macOS application

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-app:
    name: macOS app (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            label: x86_64
          - runner: macos-15
            arch: arm64
            label: aarch64
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Test desktop build natively
        run: go test -tags desktop -race ./...

      - name: Vet desktop build
        run: go vet -tags desktop ./...

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build console
        working-directory: web
        run: npm ci && npm run build

      - name: Package application
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_ARCH: ${{ matrix.arch }}
        run: scripts/package-macos.sh "$APP_VERSION" "$APP_ARCH" "$RUNNER_TEMP/macos-release"

      - name: Smoke test packaged application
        run: scripts/smoke-macos.sh "$RUNNER_TEMP"/macos-release/*-app.zip

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.label }}-app
          path: ${{ runner.temp }}/macos-release/*-app.zip
          if-no-files-found: error
          retention-days: 14
